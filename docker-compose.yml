services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        RESEND_API_KEY: ${RESEND_API_KEY}
    env_file:
      - path: .env.production
        required: false
      - path: .env.local
        required: false
    environment:
      LEGAL_RAG_URL: http://legal-rag:8080
      LEGAL_RAG_INTERNAL_TOKEN: ${LEGAL_RAG_INTERNAL_TOKEN}
    depends_on:
      legal-rag:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - vfbcai

  legal-rag:
    build:
      context: ./services/legal-rag
      dockerfile: Dockerfile
    env_file:
      - path: ./services/legal-rag/.env.production
        required: false
      - path: ./services/legal-rag/.env
        required: false
    environment:
      LEGAL_RAG_INTERNAL_TOKEN: ${LEGAL_RAG_INTERNAL_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LEGAL_RAG_DOCUMENTS_PATH: ${LEGAL_RAG_DOCUMENTS_PATH:-data/corpus/pilot_10000/documents.jsonl}
      LEGAL_RAG_CHUNKS_PATH: ${LEGAL_RAG_CHUNKS_PATH:-data/corpus/pilot_10000/chunks.jsonl}
      LEGAL_RAG_RELATIONSHIPS_PATH: ${LEGAL_RAG_RELATIONSHIPS_PATH:-data/corpus/pilot_10000/internal_relations.jsonl}
    volumes:
      - ./services/legal-rag/data/corpus/pilot_10000:/app/data/corpus/pilot_10000:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - vfbcai

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - vfbcai

networks:
  vfbcai:
    driver: bridge

volumes:
  certbot-certs:
